[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# Cache estático de longa duração para a malha oficial de polígonos IBGE (/data/brasil-geopolygons.json)
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fallback SPA para rotas client-side
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
